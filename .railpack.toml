[phases.setup]
phpExtensions = [
  "ctype",
  "curl",
  "dom",
  "fileinfo",
  "mbstring",
  "openssl",
  "pdo",
  "pdo_sqlite",
  "tokenizer",
  "xml",
  "gd",
  "zip"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install --legacy-peer-deps",
  "npm run build"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && heroku-php-apache2 public/"